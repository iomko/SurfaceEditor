name: Cpp CI SurfaceEditor

on:
  push:
  pull_request:

  workflow_dispatch:
    inputs:
      modules:
        description: "Moduly: octree quadtree halfedge mesh printableMesh"
        required: false
        default: ""

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            python3 \
            python3-pip \
            python3-jinja2 \
            libx11-dev \
            libgl1-mesa-dev \
            libglfw3-dev \
            libglm-dev \
            libtiff-dev \
            libcurl4-openssl-dev \
            libeigen3-dev 

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          cd build

          MODULES="${{ github.event.inputs.modules }}"

          FLAGS="" 
          # example of setting flags: FLAGS="$FLAGS -DBUILD_PLUGIN_AddCubePlugin=ON"
          TEST_ARGS=""
          # example of setting test args: TEST_ARGS="$TEST_ARGS [octree],"

          # default (push / PR)
          if [ -z "$MODULES" ]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release -DCI_BUILD=ON
            exit 0
          fi

          # OCTREE
          if [[ "$MODULES" == *"octree"* ]]; then
            TEST_ARGS="$TEST_ARGS [octree],"
          fi

          # QUADTREE
          if [[ "$MODULES" == *"quadtree"* ]]; then
            TEST_ARGS="$TEST_ARGS [quadtree],"
          fi

          # HEADEDGE
          if [[ "$MODULES" == *"halfedge"* ]]; then
            TEST_ARGS="$TEST_ARGS [extendedHalfEdge],"
          fi

          # MESH
          if [[ "$MODULES" == *"mesh"* ]]; then
            TEST_ARGS="$TEST_ARGS [mesh],"
          fi

          # PRINTABLE MESH
          if [[ "$MODULES" == *"printableMesh"* ]]; then
            TEST_ARGS="$TEST_ARGS [PrintableMesh],"
          fi

          echo "FLAGS=$FLAGS" >> $GITHUB_ENV
          echo "TEST_ARGS=$TEST_ARGS" >> $GITHUB_ENV

          cmake .. -DCMAKE_BUILD_TYPE=Release -DCI_BUILD=ON $FLAGS

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          cd build
          echo "FLAGS=$FLAGS"
          echo "TEST_ARGS=$TEST_ARGS"
          ./Test $TEST_ARGS