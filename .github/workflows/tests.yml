name: C++ Tests

on:
  push:
  pull_request:

jobs:
  build-and-test:name: C++ CI (SurfaceEditor)

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          libx11-dev \
          libgl1-mesa-dev \
          libglfw3-dev \
          libglm-dev \
          libtiff-dev \
          libcurl4-openssl-dev \
          libeigen3-dev

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel

    - name: Run tests
      run: ctest --test-dir build --output-on-failure
